services:
  website:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run build --workspace website && cp -r apps/website/dist/* /srv/website"
    volumes:
      - .:/workspace
      - website_dist:/srv/website

  dashboard:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run build --workspace dashboard && cp -r apps/dashboard/dist/* /srv/dashboard"
    volumes:
      - .:/workspace
      - dashboard_dist:/srv/dashboard

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine

  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - website_dist:/srv/website:ro
      - dashboard_dist:/srv/dashboard:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - dashboard
      - backend

volumes:
  postgres_data:
  website_dist:
  dashboard_dist:
  caddy_data:
  caddy_config:
